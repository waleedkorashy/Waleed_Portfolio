<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f7f9fc" />
    <title>Page not found | Waleed Korashy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'dark') document.documentElement.classList.add('dark')
        if (theme === 'light') document.documentElement.classList.add('light')
      } catch {}
    </script>
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #ffffff;
        --text: #101827;
        --muted: #5c6b7d;
        --border: #d9e2ef;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #eff6ff;
        --shadow: 0 24px 70px rgba(15, 23, 42, 0.1);
        color-scheme: light;
      }

      :root.dark {
        --bg: #0b1220;
        --surface: #111c31;
        --text: #e8eef8;
        --muted: #9db0c7;
        --border: #24334d;
        --primary: #5b9bfc;
        --primary-hover: #82b4ff;
        --primary-soft: #0f1c33;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        color-scheme: dark;
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --bg: #0b1220;
          --surface: #111c31;
          --text: #e8eef8;
          --muted: #9db0c7;
          --border: #24334d;
          --primary: #5b9bfc;
          --primary-hover: #82b4ff;
          --primary-soft: #0f1c33;
          --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 32rem),
          var(--bg);
        color: var(--text);
        display: flex;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        line-height: 1.6;
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        padding: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        max-width: 640px;
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        width: 100%;
      }

      .eyebrow {
        background: var(--primary-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--primary);
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        margin: 0 0 22px;
        padding: 7px 14px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.4rem, 8vw, 4.25rem);
        letter-spacing: -0.05em;
        line-height: 1;
        margin: 0;
      }

      .message {
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.1rem);
        margin: 22px auto 0;
        max-width: 42ch;
      }

      .actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 16px 22px;
        justify-content: center;
        margin-top: 32px;
      }

      .button {
        background: var(--primary);
        border-radius: 10px;
        color: #ffffff;
        font-weight: 800;
        padding: 13px 22px;
        text-decoration: none;
      }

      .button:hover {
        background: var(--primary-hover);
      }

      .text-link {
        color: var(--primary);
        font-weight: 700;
        text-underline-offset: 4px;
      }

      a:focus-visible {
        border-radius: 6px;
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }

      @media (max-width: 420px) {
        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="not-found-title">
      <p class="eyebrow">404</p>
      <h1 id="not-found-title">Page not found</h1>
      <p class="message">
        The page you requested doesn’t exist. It may have moved, or the link may be incorrect.
      </p>
      <div class="actions">
        <a class="button" href="/">Back to portfolio</a>
        <a class="text-link" href="/#contact">Contact me</a>
      </div>
    </main>
  </body>
</html>
