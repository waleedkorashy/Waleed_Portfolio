<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="medipass-title medipass-desc">
  <title id="medipass-title">MediPass+ — Medical History Platform</title>
  <desc id="medipass-desc">A simple logo cover: a blue-to-teal gradient badge with a white medical cross above the MediPass+ wordmark.</desc>
  <defs>
    <linearGradient id="mp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#e7f1ff" />
