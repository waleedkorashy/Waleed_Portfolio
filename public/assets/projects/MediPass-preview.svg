    <linearGradient id="mp-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#0ea5a4" />
    </linearGradient>
    <radialGradient id="mp-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.10" />
      <stop offset="1" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#mp-bg)" />
